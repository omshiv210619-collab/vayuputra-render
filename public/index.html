<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>body{background:#070a12;color:#cfe8ff;font-family:system-ui;padding:12px}#q{background:#fff;padding:10px;border-radius:12px;width:fit-content;margin:auto}.c{background:#12182a;border:1px solid #223055;border-radius:12px;padding:10px;margin:8px 0}.m{font-family:monospace;word-break:break-all}</style></head><body><h3>🚀 VAYUPUTRA EVOLVED LIVE</h3><div class="c">IST:<span id="i"></span><br>PUBLIC:<span id="u" class="m"></span><br>STATUS:<span id="s"></span></div><div class="c"><center><div id="q"></div><div id="qt" class="m" style="font-size:10px"></div></center></div><pre id="v" class="m"></pre><script>let L="";function mk(t){document.getElementById('q').innerHTML="";new QRCode(document.getElementById('q'),{text:t,width:180,height:180});document.getElementById('qt').innerText=t}function tk(){fetch('/api/vault/status').then(r=>r.json()).then(j=>{document.getElementById('i').innerText=j.ist;document.getElementById('u').innerText=j.public_url;document.getElementById('s').innerText=j.tunnel;document.getElementById('v').innerText=JSON.stringify(j,null,2);if(j.public_url!=L){L=j.public_url;mk(L)}})}setInterval(tk,2000);tk();mk(location.href)</script></body></html>
