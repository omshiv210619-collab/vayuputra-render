<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{margin:0;background:#111b21;color:#e9edef;font-family:system-ui}.w{background:#ffcc00;color:#000;font-size:11px;padding:6px;text-align:center}.ch{height:62vh;overflow:auto;padding:10px;display:flex;flex-direction:column}.b{max-width:78%;padding:8px;border-radius:8px;margin:6px 0}.me{align-self:flex-end;background:#005c4b}.bot{align-self:flex-start;background:#202c33}.bar{position:fixed;bottom:0;left:0;right:0;background:#202c33;display:flex;padding:8px;gap:6px}.bar input{flex:1;border-radius:20px;border:none;padding:10px}.bar button{background:#00a884;border:none;color:#fff;padding:10px 14px;border-radius:20px}</style></head><body><div class="w">DEMO ONLY - NOT RBI - NOT REAL e₹ - BCFPJ3172G</div><div class="ch" id="ch"><div class="b bot">e₹ Demo Bot ready. Type balance, send 10, history<br><small>Delivery: Sent 180ms / Delivered 620ms / Read 842ms</small></div></div><div class="bar"><input id="in" placeholder="balance"><button onclick="go()">➤</button></div><script>async function go(){let i=document.getElementById('in'),t=i.value.trim();if(!t)return;let c=document.getElementById('ch');c.innerHTML+=`<div class="b me">${t} <small>✓ ${new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})}</small></div>`;i.value='';let r=await fetch('/api/e_rupee/demo/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});let j=await r.json();c.innerHTML+=`<div class="b bot">${j.reply}<br><small>✓✓ Delivered ${j.delivery_ms}ms | ${j.delivered_at}</small></div>`;c.scrollTop=c.scrollHeight}document.getElementById('in').addEventListener('keydown',e=>{if(e.key==='Enter')go()})</script></body></html>
